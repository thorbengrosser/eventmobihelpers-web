{% extends 'base_form.html' %}
{% block form_content %}
  <h2>Enter Attendee Email Addresses</h2>
  <form method="post">
    {{ form.hidden_tag() }}
    <div class="form-group">
      {{ form.emails.label }}
      {{ form.emails(class="form-control", rows=6) }}
    </div>
    <div class="form-group">
      {{ form.submit(class="btn btn-primary") }}
    </div>
  </form>
{% endblock %}
