<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EventMobi Helpers{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        :root{
            --brand-orange:#EE7700;
            --brand-orange-dark:#D56800;
            --brand-orange-subtle: rgba(238,119,0,0.08);
            --brand-grey:#5B6770;
            --brand-charcoal:#1D252D;
            --brand-mid:#7C878E;
            --border:#E6E8EA;
        }
        body{
            font-family:'Nunito', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            color:var(--brand-charcoal);
            background: linear-gradient(135deg, var(--brand-orange-subtle) 0%, #fff 100%);
            min-height:100vh;
        }
        h1,h2,h3,.hero-text{ font-family:'Lato', system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
        .btn-primary{
            background-color:var(--brand-orange);
            border-color:var(--brand-orange);
            padding:0.75rem 1.25rem;
            font-weight:700;
            border-radius:10px;
        }
        .btn-primary:hover{
            background-color:var(--brand-orange-dark);
            border-color:var(--brand-orange-dark);
            transform:translateY(-1px);
            box-shadow:0 6px 16px rgba(238,119,0,0.22);
        }
        .text-primary{ color:var(--brand-orange)!important; }
        .card{
            border-radius:14px;
            border:1px solid var(--border);
            box-shadow:0 6px 24px rgba(0,0,0,0.06);
            transition:transform .2s ease, box-shadow .2s ease;
            background:#fff;
        }
        .card:hover{ transform:translateY(-2px); box-shadow:0 10px 28px rgba(0,0,0,0.08); }
        .form-control{
            border-radius:10px;
            padding:0.75rem 1rem;
            border:1px solid var(--border);
            transition:all .2s ease;
        }
        .form-control:focus{
            border-color:var(--brand-orange);
            box-shadow:0 0 0 3px rgba(238,119,0,0.15);
        }
        .form-label{ font-weight:700; color:var(--brand-charcoal); margin-bottom:.5rem; }
        .section-padding{ padding:3rem 0; }
        @media (min-width: 992px){ .section-padding{ padding:4rem 0; } }
        .hero-text{ font-size:1.5rem; font-weight:900; color:var(--brand-charcoal); margin-bottom:.5rem; }
        .hero-subtext{ font-size:1rem; color:var(--brand-grey); }
        .feature-list{ list-style:none; padding:0; margin:0; }
        .feature-list li{ padding:.5rem 0; color:var(--brand-grey); }
        .feature-list li:not(:last-child){ border-bottom:1px solid rgba(0,0,0,0.05); }
        @keyframes fadeIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }
        .fade-in{ animation:fadeIn .5s ease-out; }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category if category != 'message' else 'info' }} alert-dismissible fade show mt-3" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
